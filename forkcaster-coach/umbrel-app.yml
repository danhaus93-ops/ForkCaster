repo: https://github.com/danhaus93-ops/ForkCaster
support: https://github.com/danhaus93-ops/ForkCaster/issues
icon: https://raw.githubusercontent.com/danhaus93-ops/ForkCaster/main/dist/icon.svg
gallery: []
releaseNotes: >-
  The med level shown on the collapsed card was wrong. It was estimated by a rough
  formula instead of the actual model, so it disagreed with the chart behind it. The
  model now lives in one place and both read it — the number on the row is the same
  number the curve draws, and the little chart is your real curve, not a sketch.
