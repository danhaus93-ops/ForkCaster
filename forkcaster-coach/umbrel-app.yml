manifestVersion: 1
id: forkcaster-coach
name: ForkCaster
tagline: Medication-aware nutrition coach — what to order, right now
category: ai
version: "0.5.4"
port: 3450
description: >-
  ForkCaster is a self-hosted, GPS-aware nutrition coach. It ranks what to
  order at restaurants near you against your remaining macros for the day,
  adjusts recommendations to your GLP-1 medication, dose week, and logged
  nausea, correlates side effects with meals, filters allergens out of every
  suggestion, and tracks weight, body composition, and progress photos — all
  on your own hardware. Requires an Anthropic API key for AI features; a
  Google Places key is optional for live nearby restaurants.
developer: ForkCaster
website: https://github.com/danhaus93-ops/ForkCaster
repo: https://github.com/danhaus93-ops/ForkCaster
support: https://github.com/danhaus93-ops/ForkCaster/issues
icon: https://raw.githubusercontent.com/danhaus93-ops/ForkCaster/main/dist/icon.svg
gallery: []
releaseNotes: >-
  v0.5.4: every recipe in your plan is now cookable inside the app. Searched
  recipes previously arrived with no ingredients and no steps, so they added
  nothing to your grocery list and sent you to another website to cook - now
  the full ingredient list and prep steps come with them, formatted for the
  grocery list and shown on the recipe card, with the original source kept
  only as a small credit. Anything that cannot be shown completely is left
  out of the plan entirely. The recipe net is also wider: twelve candidates
  per meal type instead of six, filtered to recipes that actually include
  instructions.
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
submitter: ForkCaster
submission: https://github.com/danhaus93-ops/ForkCaster
