releaseNotes: >-
  v0.9.53: the med-level chart gets the full treatment. The curve now
  fills with a violet gradient, a green dashed steady-state line marks
  100 percent, your current level shows as a violet pill badge, and
  every chart label switches to the instrument typeface. Same math,
  same model, same honesty note - just finally dressed like the rest.
