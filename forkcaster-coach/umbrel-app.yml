gallery: []
releaseNotes: >-
  Fixes the crash on the GLP-1 tab in compact mode. Two of the new collapsed rows
  reached for values that live in a different part of the code; they now work out
  their own dose and ladder. The test rig also renders every tab in compact from now
  on, which is what should have caught this before it reached your phone.
