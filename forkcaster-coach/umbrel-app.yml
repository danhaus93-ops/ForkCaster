repo: https://github.com/danhaus93-ops/ForkCaster
support: https://github.com/danhaus93-ops/ForkCaster/issues
icon: https://raw.githubusercontent.com/danhaus93-ops/ForkCaster/main/dist/icon.svg
gallery: []
releaseNotes: >-
  The dose checkpoint now tells you the first shot day you can actually step up on, not
  just when the hold expires — those can be several days apart if the hold ends midweek.
