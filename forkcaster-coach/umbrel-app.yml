manifestVersion: 1
id: forkcaster-coach
name: ForkCaster
tagline: Medication-aware nutrition coach — what to order, right now
category: ai
version: "0.6.7"
port: 3450
description: >-
  ForkCaster is a self-hosted, GPS-aware nutrition coach. It ranks what to
  order at restaurants near you against your remaining macros for the day,
  adjusts recommendations to your GLP-1 medication, dose week, and logged
  nausea, correlates side effects with meals, filters allergens out of every
  suggestion, and tracks weight, body composition, and progress photos — all
  on your own hardware. Requires an Anthropic API key for AI features; a
  Google Places key is optional for live nearby restaurants.
developer: ForkCaster
website: https://github.com/danhaus93-ops/ForkCaster
repo: https://github.com/danhaus93-ops/ForkCaster
support: https://github.com/danhaus93-ops/ForkCaster/issues
icon: https://raw.githubusercontent.com/danhaus93-ops/ForkCaster/main/dist/icon.svg
gallery: []
releaseNotes: >-
  v0.6.7: routines now read like a program a coach would write. Exercise
  choice is ranked by movement pattern - bench press, squat, deadlift, row,
  pull-up and overhead press lead sessions, while curls, shrugs and flyes fill
  accessory slots - and main lifts must be loadable, since the progression
  engine adds weight. Variety is judged by stimulus (muscle, direction, type)
  rather than by exercise names, so a press, a row and an overhead press can
  share a session while two horizontal presses cannot. Main lifts may now
  repeat across the week, which is normal training and gives progression
  tracking more data. Also moves good mornings and deadlift variants off upper
  body days, where the source data had filed them.
  match found.
