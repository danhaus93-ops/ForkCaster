releaseNotes: >-
  v0.9.60: CRITICAL FIX - v0.9.59 crashed the app on the GLP-1 tab
  for anyone with logged doses (a code-ordering error in the new
  ghost-dose drawing). Fixed, and the test rig now deep-renders every
  tab with real dose data before any release can ship, so this class
  of crash cannot reach your phone again. Update immediately.
