gallery: []
releaseNotes: >-
  v0.8.6: a chain that publishes its own GLP-1 menu now shows the whole menu,
  not the top three. Smoothie King lists ten GLP-1 items, but three of them
  are Gladiator flavors and three are Power Meal Slim flavors, and the
  flavor-grouping rule that keeps a normal ranking varied was folding them
  together. Curated published menus are now shown in full and ranked, while
  every other venue still shows the best three picks. Ranking also handles
  portion size more sensibly: a small-volume bonus used to switch off
  abruptly at 400 calories, so a 450 calorie item with more protein could
  rank below a smaller one with less. That bonus now tapers smoothly, and
  Keto Champ sits where its protein says it should.
