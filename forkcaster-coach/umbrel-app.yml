gallery: []
releaseNotes: >-
  The wrong last-dose date is fixed — it was a leftover stored copy; the date now
  always comes from your dose log, newest entry wins. The next-injection card has
  merged into the dose calendar, which already showed the countdown: Log dose and
  your last-dose line live there now, so the tab has one card about timing.
