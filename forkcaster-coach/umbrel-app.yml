icon: https://raw.githubusercontent.com/danhaus93-ops/ForkCaster/main/dist/icon.svg
gallery: []
releaseNotes: >-
  v0.9.69: the second full scan pass. Train gains warm-up and
  cool-down cards with movement chips matched to the sessions focus,
  a Fuel guard card and a TARGET 10-20 badge on weekly sets. The
  dose-response table gets its designed labels and pill tiers, the
  dose calendar names itself, adaptive targets show how they are
  derived, and the scale and journey cards pick up their final
  labels.
