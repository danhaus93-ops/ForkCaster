repo: https://github.com/danhaus93-ops/ForkCaster
support: https://github.com/danhaus93-ops/ForkCaster/issues
icon: https://raw.githubusercontent.com/danhaus93-ops/ForkCaster/main/dist/icon.svg
gallery: []
releaseNotes: >-
  Any card on Body can now be moved anywhere on the tab — the top four were in a
  separate group that nothing could cross. Dragging no longer flickers or ghosts.
  And the titration ladder has merged into your protocol card, which was showing the
  same rungs twice; tapping a rung there still records the dose.
