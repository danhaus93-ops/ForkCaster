repo: https://github.com/danhaus93-ops/ForkCaster
support: https://github.com/danhaus93-ops/ForkCaster/issues
icon: https://raw.githubusercontent.com/danhaus93-ops/ForkCaster/main/dist/icon.svg
gallery: []
releaseNotes: >-
  The med level row and the chart now show the same number. The row was measuring
  against steady state while the chart measured against your last peak, so one said
  76 and the other 164 on the same screen. The row reads the chart's number now, and
  its second line reads absorbing and the peak, as designed.
