repo: https://github.com/danhaus93-ops/ForkCaster
support: https://github.com/danhaus93-ops/ForkCaster/issues
icon: https://raw.githubusercontent.com/danhaus93-ops/ForkCaster/main/dist/icon.svg
gallery: []
releaseNotes: >-
  Dragging actually works now. Two things were stopping it: a setting that told the
  browser it owned vertical swipes, so it scrolled the page and cancelled the drag
  the moment it began, and a hold that any tiny finger movement cancelled before it
  could start. Hold a card, it lifts, drag it, let go.
