manifestVersion: 1
id: forkcaster-coach
name: ForkCaster
tagline: Medication-aware nutrition coach — what to order, right now
category: ai
version: "0.7.0"
port: 3450
description: >-
  ForkCaster is a self-hosted, GPS-aware nutrition coach. It ranks what to
  order at restaurants near you against your remaining macros for the day,
  adjusts recommendations to your GLP-1 medication, dose week, and logged
  nausea, correlates side effects with meals, filters allergens out of every
  suggestion, and tracks weight, body composition, and progress photos — all
  on your own hardware. Requires an Anthropic API key for AI features; a
  Google Places key is optional for live nearby restaurants.
developer: ForkCaster
website: https://github.com/danhaus93-ops/ForkCaster
repo: https://github.com/danhaus93-ops/ForkCaster
support: https://github.com/danhaus93-ops/ForkCaster/issues
icon: https://raw.githubusercontent.com/danhaus93-ops/ForkCaster/main/dist/icon.svg
gallery: []
releaseNotes: >-
  v0.7.0: Path to your forecast. The Body tab now turns your goal weight into
  the numbers that actually decide whether you get there - how much fat to
  lose, how much lean mass to protect, the body-fat percentage your goal
  implies, and a protein floor computed from lean mass rather than scale
  weight. It projects a finish date from your real measured rate alongside the
  healthy-rate estimate, and grades the four levers that decide the outcome
  each week: protein, lean mass holding, lifting sessions, and loss rate - so
  a bad week tells you which one slipped. Goals that would require dropping
  below a healthy body-fat floor are flagged as a conversation for your
  prescriber, not silently accepted. Your prescriber report now opens with the
  stated goal.
  match found.
