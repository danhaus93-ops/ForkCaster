manifestVersion: 1
id: forkcaster-coach
name: ForkCaster
tagline: Medication-aware nutrition coach — what to order, right now
category: ai
version: "0.9.17"
port: 3450
description: >-
  ForkCaster is a self-hosted, GPS-aware nutrition coach. It ranks what to
  order at restaurants near you against your remaining macros for the day,
  adjusts recommendations to your GLP-1 medication, dose week, and logged
  nausea, correlates side effects with meals, filters allergens out of every
  suggestion, and tracks weight, body composition, and progress photos — all
  on your own hardware. Requires an Anthropic API key for AI features; a
  Google Places key is optional for live nearby restaurants.
developer: ForkCaster
website: https://github.com/danhaus93-ops/ForkCaster
repo: https://github.com/danhaus93-ops/ForkCaster
support: https://github.com/danhaus93-ops/ForkCaster/issues
icon: https://raw.githubusercontent.com/danhaus93-ops/ForkCaster/main/dist/icon.svg
gallery: []
releaseNotes: >-
  v0.9.17: night shift support, and a day-boundary fix for everyone. The app
  was rolling its day on UTC time - about 7 PM in US Central - so meals
  logged in the evening were quietly stamped onto tomorrow. One clock now
  runs everything, on your phone's local time zone. New in Settings: a Work
  schedule setting with three modes - Day shift, fixed Nights, and rotating
  Nights with a two-week tap strip to mark the nights you work. On marked
  nights your day runs into the next morning, so a 3 AM meal counts toward
  the day you are living; the Today header shows a NIGHT DAY badge; the day
  after your last night is labeled for recovery; and training steers heavy
  sessions off work nights the same way it already dodges your shot window.
  Doses and the PK chart stay on calendar dates - medical records don't
  shift. Rebuild the routine in Train to pick up night-aware scheduling.
