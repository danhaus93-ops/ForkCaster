manifestVersion: 1
id: forkcaster-coach
name: ForkCaster
tagline: Medication-aware nutrition coach — what to order, right now
category: ai
version: "0.8.4"
port: 3450
description: >-
  ForkCaster is a self-hosted, GPS-aware nutrition coach. It ranks what to
  order at restaurants near you against your remaining macros for the day,
  adjusts recommendations to your GLP-1 medication, dose week, and logged
  nausea, correlates side effects with meals, filters allergens out of every
  suggestion, and tracks weight, body composition, and progress photos — all
  on your own hardware. Requires an Anthropic API key for AI features; a
  Google Places key is optional for live nearby restaurants.
developer: ForkCaster
website: https://github.com/danhaus93-ops/ForkCaster
repo: https://github.com/danhaus93-ops/ForkCaster
support: https://github.com/danhaus93-ops/ForkCaster/issues
icon: https://raw.githubusercontent.com/danhaus93-ops/ForkCaster/main/dist/icon.svg
gallery: []
releaseNotes: >-
  v0.8.4: grocery lists finally read like a shopping list. Item names came
  straight from recipe wording, so "Celery", "Celery hearts" and "finely
  chopped celery" were three separate lines, as were "whey", "Vanilla whey"
  and "Vanilla whey protein". Names are now normalised properly - prep
  instructions, stray quantities, parentheses and garnish notes are stripped
  for matching, and near-identical entries merge into one line under the
  cleanest name, keeping any checkmark. Variety words are protected, so black
  and green beans, white and black pepper, brown and jasmine rice stay
  separate. Lines also display cleanly now: "or 2 Tablespoons orange juice"
  becomes "Orange juice", while product words like shredded, part-skim and
  ground are kept.
  pepper.
  match found.
