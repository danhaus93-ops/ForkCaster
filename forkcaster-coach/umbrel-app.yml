repo: https://github.com/danhaus93-ops/ForkCaster
support: https://github.com/danhaus93-ops/ForkCaster/issues
icon: https://raw.githubusercontent.com/danhaus93-ops/ForkCaster/main/dist/icon.svg
gallery: []
releaseNotes: >-
  Coach said the same thing three times — a badge, a row of counts and a greeting
  all announcing that it can see your macros, weight and meds. The badge and the
  greeting are gone. The counts stay, because they are the only version that proves
  it instead of claiming it. That also clears the overlap the badge was causing.
