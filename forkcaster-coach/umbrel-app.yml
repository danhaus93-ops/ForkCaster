icon: https://raw.githubusercontent.com/danhaus93-ops/ForkCaster/main/dist/icon.svg
gallery: []
releaseNotes: >-
  v0.9.70: deep text scan of the redesign against Train and GLP-1.
  The fat-ceiling engine finally gets its card on the GLP-1 tab - it
  has been learning your dose-window fat tolerance since v0.4 and
  shaping meal picks, but never showed itself; now it reports its
  ceiling, its evidence counts, and an honest collecting state. Your
  protocol shows RUNG X OF N, the editor names itself, the tab
  subtitle matches the design, the form switch gets its icons,
  side-effect entries show hours post-dose, weekly sets use the
  designed muscle labels, and the week view explains eased days.
