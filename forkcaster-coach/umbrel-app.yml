manifestVersion: 1
id: forkcaster-coach
name: ForkCaster
tagline: Medication-aware nutrition coach — what to order, right now
category: ai
version: "0.9.13"
port: 3450
description: >-
  ForkCaster is a self-hosted, GPS-aware nutrition coach. It ranks what to
  order at restaurants near you against your remaining macros for the day,
  adjusts recommendations to your GLP-1 medication, dose week, and logged
  nausea, correlates side effects with meals, filters allergens out of every
  suggestion, and tracks weight, body composition, and progress photos — all
  on your own hardware. Requires an Anthropic API key for AI features; a
  Google Places key is optional for live nearby restaurants.
developer: ForkCaster
website: https://github.com/danhaus93-ops/ForkCaster
repo: https://github.com/danhaus93-ops/ForkCaster
support: https://github.com/danhaus93-ops/ForkCaster/issues
icon: https://raw.githubusercontent.com/danhaus93-ops/ForkCaster/main/dist/icon.svg
gallery: []
releaseNotes: >-
  v0.9.13: food search works again, and tells the truth when it cannot. It
  had a single source wrapped in error handling that turned every failure -
  a timeout, a rate limit, the database being down - into the same "No
  matches, try fewer words" as a genuine miss, so nothing typed changed the
  answer. Search now asks USDA FoodData Central first, which is the right
  database for generic foods like chicken breast, and falls back to Open
  Food Facts for packaged items. When neither can be reached it says so in
  plain terms instead of blaming the query. Settings also gains the USDA
  key field - the server supported the key all along but there was nowhere
  to enter it; a free key from api.data.gov lifts the shared rate limit,
  and search works without one at low volume.
dependencies: []
