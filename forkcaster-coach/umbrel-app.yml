manifestVersion: 1
id: forkcaster-coach
name: ForkCaster
tagline: Medication-aware nutrition coach — what to order, right now
category: ai
version: "0.9.4"
port: 3450
description: >-
  ForkCaster is a self-hosted, GPS-aware nutrition coach. It ranks what to
  order at restaurants near you against your remaining macros for the day,
  adjusts recommendations to your GLP-1 medication, dose week, and logged
  nausea, correlates side effects with meals, filters allergens out of every
  suggestion, and tracks weight, body composition, and progress photos — all
  on your own hardware. Requires an Anthropic API key for AI features; a
  Google Places key is optional for live nearby restaurants.
developer: ForkCaster
website: https://github.com/danhaus93-ops/ForkCaster
repo: https://github.com/danhaus93-ops/ForkCaster
support: https://github.com/danhaus93-ops/ForkCaster/issues
icon: https://raw.githubusercontent.com/danhaus93-ops/ForkCaster/main/dist/icon.svg
gallery: []
releaseNotes: >-
  v0.9.4: scan a scale report. The Body tab can now read a body composition
  report photo and bring the numbers in - body fat, lean mass, muscle mass,
  body water, visceral fat and per-limb figures, most of which Apple Health
  has no field for. Nothing saves until the parsed values are shown and
  confirmed, and readings that contradict each other are flagged rather than
  stored. Also removes the placeholder body measurements: the app shipped a
  default height, neck and waist, so the body fat tile computed a
  plausible-looking number from figures nobody had entered, and the goal
  contract set a protein floor from it. Those fields now start empty, a
  measured reading outranks the tape-measure estimate, and the tile says
  which one it is showing.
dependencies: []
