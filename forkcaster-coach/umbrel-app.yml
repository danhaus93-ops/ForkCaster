releaseNotes: >-
  v0.9.63: Body tab per your markup - the Forecaster preview card and
  the duplicate weight card are gone; Path to your forecast is now the
  single weight home, powered by the real goal-contract engine, with
  the trend graph, your logged weigh-ins and the Log box folded in.
  The med-level tiles also show direction now: on shot day each tile
  says what it was before the injection, so the climb is visible.
