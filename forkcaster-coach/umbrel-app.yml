manifestVersion: 1
id: forkcaster-coach
name: ForkCaster
tagline: Medication-aware nutrition coach — what to order, right now
category: ai
version: "0.9.0"
port: 3450
description: >-
  ForkCaster is a self-hosted, GPS-aware nutrition coach. It ranks what to
  order at restaurants near you against your remaining macros for the day,
  adjusts recommendations to your GLP-1 medication, dose week, and logged
  nausea, correlates side effects with meals, filters allergens out of every
  suggestion, and tracks weight, body composition, and progress photos — all
  on your own hardware. Requires an Anthropic API key for AI features; a
  Google Places key is optional for live nearby restaurants.
developer: ForkCaster
website: https://github.com/danhaus93-ops/ForkCaster
repo: https://github.com/danhaus93-ops/ForkCaster
support: https://github.com/danhaus93-ops/ForkCaster/issues
icon: https://raw.githubusercontent.com/danhaus93-ops/ForkCaster/main/dist/icon.svg
gallery: []
releaseNotes: >-
  v0.9.0: core training is prescribed properly. Holds such as the plank were
  being given a rep range - "10 to 20 reps of Plank" - because every core
  movement got the same scheme. Static positions are now prescribed in
  seconds with their own timer, while movements that travel (rollouts, dead
  bugs, crunches, leg raises) correctly stay in reps. Core days also run as a
  circuit: rounds through the movements with a short gap between them,
  roughly a four to five minute block for the same work as straight sets.
  Progression understands time too, adding seconds toward the ceiling and
  then suggesting a harder variation rather than a longer hold. Rebuild the
  routine in Train to pick this up; existing routines and logged history are
  unaffected.
