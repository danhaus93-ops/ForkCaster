repo: https://github.com/danhaus93-ops/ForkCaster
support: https://github.com/danhaus93-ops/ForkCaster/issues
icon: https://raw.githubusercontent.com/danhaus93-ops/ForkCaster/main/dist/icon.svg
gallery: []
releaseNotes: >-
  Your journey card was stuck on Ramp-up. It was reading a value saved when the app
  was first set up and never updated since. It now works out where you are from your
  dose log — Ramp-up for two weeks after a step up, Active loss once the dose settles.
